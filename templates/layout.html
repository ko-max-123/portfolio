<!-- 共通レイアウト。文章は content/、見た目は style.css を編集します。 -->
<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="{{page.description}}">
    <meta name="robots" content="index,follow">
    <meta name="author" content="{{site.author}}">
    <meta name="google-site-verification" content="{{site.verification}}" />
    <title>{{page.title}}</title>

    <!-- Site icons -->
    <link rel="icon" href="{{site.modes.lab.favicon}}" type="image/svg+xml" data-dynamic-favicon>
    <link rel="icon" href="{{site.modes.lab.faviconPng}}" sizes="32x32" type="image/png" data-dynamic-favicon-png>
    <link rel="shortcut icon" href="./favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="./site.webmanifest">
    <meta name="theme-color" content="{{site.modes.lab.themeColor}}" data-theme-color>
    <link rel="stylesheet" href="./style.css">
    <link rel="sitemap" type="application/xml" href="./sitemap.xml">
  </head>
  <body data-theme="lab">
    {{{header}}}
    <main>
      {{{main}}}
    </main>
    {{{footer}}}
    <script src="./projects-data.js">
    </script>
    <script src="./app.js">
    </script>
  </body>
</html>
